services:
  - type: web
    name: stegovault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stegovault-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false

databases:
  - name: stegovault-db
    plan: free
    databaseName: stegovault
    user: stegovault
